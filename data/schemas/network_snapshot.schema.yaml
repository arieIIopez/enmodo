$schema: https://json-schema.org/draft/2020-12/schema
title: ENMODO Network Snapshot
type: object
additionalProperties: false
required:
  - snapshot_id
  - city_id
  - target_date
  - source_name
  - source_type
  - modes
  - artifact_status
  - temporal_distance_days
  - confidence
properties:
  snapshot_id:
    type: string
    description: Stable ENMODO identifier for one versioned network artifact or modeled layer.
  city_id:
    type: string
  target_date:
    type: string
    format: date
    description: Date the network is intended to represent.
  source_date:
    type: [string, 'null']
    format: date
    description: Date of the actual source snapshot/feed when known.
  source_name:
    type: string
  source_type:
    type: string
    enum:
      - osm_historical_snapshot
      - gtfs_schedule
      - gtfs_route_topology
      - institutional_gis
      - survey_observed_calibration
      - reconstructed_historical_network
      - other
  source_url:
    type: [string, 'null']
  preservation_url:
    type: [string, 'null']
  artifact_sha256:
    type: [string, 'null']
    pattern: '^[0-9a-f]{64}$'
  artifact_status:
    type: string
    enum:
      - documented_only
      - preserved_identified
      - materialized_unverified
      - materialized_verified
      - transformed
  temporal_distance_days:
    type: integer
    minimum: 0
  service_date_start:
    type: [string, 'null']
    format: date
  service_date_end:
    type: [string, 'null']
    format: date
  modes:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      type: string
  geography:
    type: object
    additionalProperties: false
    properties:
      study_area_id:
        type: [string, 'null']
      coverage_description:
        type: [string, 'null']
      crs:
        type: [string, 'null']
  information_content:
    type: object
    additionalProperties: false
    properties:
      topology:
        type: boolean
      stops:
        type: boolean
      routes:
        type: boolean
      shapes:
        type: boolean
      schedules:
        type: boolean
      calendars:
        type: boolean
      frequencies:
        type: boolean
      observed_travel_times:
        type: boolean
  confidence:
    type: object
    additionalProperties: false
    required: [temporal, topology, schedule, frequency]
    properties:
      temporal:
        $ref: '#/$defs/confidenceLevel'
      topology:
        $ref: '#/$defs/confidenceLevel'
      schedule:
        $ref: '#/$defs/confidenceLevel'
      frequency:
        $ref: '#/$defs/confidenceLevel'
      notes:
        type: [string, 'null']
  transformation:
    type: object
    additionalProperties: false
    properties:
      code_version:
        type: [string, 'null']
      description:
        type: [string, 'null']
      generated_artifact_sha256:
        type: [string, 'null']
        pattern: '^[0-9a-f]{64}$'
  validation:
    type: object
    additionalProperties: false
    properties:
      population_connected_share:
        type: [number, 'null']
        minimum: 0
        maximum: 1
      opportunity_connected_share:
        type: [number, 'null']
        minimum: 0
        maximum: 1
      modeled_vs_observed_time_summary:
        type: [string, 'null']
      known_coverage_gaps:
        type: array
        items:
          type: string
  admissible_roles:
    type: array
    items:
      type: string
      enum:
        - primary_impedance
        - topology_only
        - calibration
        - validation
        - sensitivity
        - documentary_only
$defs:
  confidenceLevel:
    type: string
    enum: [unknown, low, medium, high]
