name: Paper I — Bogotá 2015 official-source QA

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/paper1_official_adapters.py'
      - 'scripts/run_bogota_2015_official_stage1.py'
      - 'tests/test_paper1_official_adapters.py'
      - '.github/workflows/paper1-bogota2015-official.yml'

jobs:
  bogota2015:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas openpyxl

      - name: Verify official source XLSX blobs
        run: |
          test -f 'bogota/2015/source-xlsx/encuesta 2015 - viajes.xlsx'
          test -f 'bogota/2015/source-xlsx/encuesta 2015 - personas.xlsx'
          test "$(stat -c '%s' 'bogota/2015/source-xlsx/encuesta 2015 - viajes.xlsx')" = '23451277'
          test "$(git hash-object 'bogota/2015/source-xlsx/encuesta 2015 - viajes.xlsx')" = '6e8e4cff17a8b2339ac738b390d7c17e30185bf5'
          test "$(stat -c '%s' 'bogota/2015/source-xlsx/encuesta 2015 - personas.xlsx')" = '24555372'
          test "$(git hash-object 'bogota/2015/source-xlsx/encuesta 2015 - personas.xlsx')" = '252a4d99434ede490f0c9b2670bddfb25178f093'

      - name: Run Bogotá direct-source reconstruction
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/bogota_2015_official_stage1
          python -m scripts.run_bogota_2015_official_stage1 \
            --output-dir outputs/bogota_2015_official_stage1 \
            2>&1 | tee bogota2015-official-stage1.log

      - name: Upload aggregate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-bogota2015-official-diagnostics
          path: |
            bogota2015-official-stage1.log
            outputs/bogota_2015_official_stage1/adapter_audit.csv
            outputs/bogota_2015_official_stage1/universe_audit.csv
            outputs/bogota_2015_official_stage1/workday_universe_summary.csv
            outputs/bogota_2015_official_stage1/person_day_qa.csv
            outputs/bogota_2015_official_stage1/support_diagnostics.csv
            outputs/bogota_2015_official_stage1/time_participation_cells.csv
            outputs/bogota_2015_official_stage1/run_metadata.json
          if-no-files-found: warn
          retention-days: 14
