name: Paper I — discover official EOD sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paper1-official-source-discovery.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install discovery dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Inspect official download pages
        shell: bash
        run: |
          python - <<'PY' | tee official-source-discovery.log
          from urllib.parse import urljoin
          import re
          import requests
          from bs4 import BeautifulSoup

          pages = [
              ("SECTRA EOD Santiago 2012", "https://www.sectra.gob.cl/info-territorial/region-metropolitana-de-santiago/"),
              ("SECTRA library record 3253", "https://www.sectra.gob.cl/biblioteca/detalle1.asp?mfn=3253"),
              ("INEGI EOD 2017", "https://www.inegi.org.mx/programas/eod/2017/"),
              ("Bogota SIMUR encuestas", "https://www.simur.gov.co/encuestas-de-movilidad"),
          ]
          terms = re.compile(r"csv|zip|xlsx|xls|mdb|accdb|rar|7z|datos|base|eod|encuesta|microdato|download|descarga", re.I)
          headers = {"User-Agent": "Mozilla/5.0 (ENMODO research reproducibility audit)"}

          for label, url in pages:
              print(f"===== {label} =====")
              print(f"URL: {url}")
              try:
                  response = requests.get(url, headers=headers, timeout=30, allow_redirects=True)
                  print(f"HTTP: {response.status_code}")
                  print(f"FINAL_URL: {response.url}")
                  print(f"BYTES: {len(response.content)}")
                  print(f"CONTENT_TYPE: {response.headers.get('content-type')}")
                  text = response.text
                  soup = BeautifulSoup(text, "html.parser")
                  candidates = []
                  for tag in soup.find_all(["a", "link", "script"]):
                      raw = tag.get("href") or tag.get("src")
                      if not raw:
                          continue
                      full = urljoin(response.url, raw)
                      label_text = " ".join(tag.stripped_strings)
                      if terms.search(full) or terms.search(label_text):
                          candidates.append((label_text[:160], full))
                  # Also scan inline absolute URLs because some portals build links in JS.
                  for raw in re.findall(r"https?://[^\s\"'<>]+", text):
                      raw = raw.replace("&amp;", "&")
                      if terms.search(raw):
                          candidates.append(("inline", raw))
                  seen = set()
                  print("-- candidates --")
                  for label_text, full in candidates:
                      if full in seen:
                          continue
                      seen.add(full)
                      print(f"{label_text}\t{full}")
                  print("-- matched text snippets --")
                  for line in text.splitlines():
                      compact = " ".join(BeautifulSoup(line, "html.parser").stripped_strings)
                      if compact and terms.search(compact):
                          print(compact[:500])
              except Exception as exc:
                  print(f"ERROR: {type(exc).__name__}: {exc}")
              print()
          PY

      - name: Upload source discovery log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-official-source-discovery
          path: official-source-discovery.log
          retention-days: 14
