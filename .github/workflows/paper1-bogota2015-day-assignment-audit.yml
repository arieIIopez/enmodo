name: Paper I — Bogotá 2015 day-assignment audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_bogota2015_day_assignment.py'
      - '.github/workflows/paper1-bogota2015-day-assignment-audit.yml'

jobs:
  audit-day-assignment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pandas openpyxl

      - name: Audit Bogotá day assignment
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.audit_bogota2015_day_assignment \
            --output-dir outputs/bogota_2015_day_assignment_audit \
            2>&1 | tee bogota2015-day-assignment-audit.log

      - name: Upload aggregate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-bogota2015-day-assignment-audit
          path: |
            bogota2015-day-assignment-audit.log
            outputs/bogota_2015_day_assignment_audit/*.csv
            outputs/bogota_2015_day_assignment_audit/*.json
          if-no-files-found: warn
          retention-days: 14
