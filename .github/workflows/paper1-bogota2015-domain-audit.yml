name: Paper I — Bogotá 2015 residence-domain audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_bogota2015_domain.py'
      - '.github/workflows/paper1-bogota2015-domain-audit.yml'

jobs:
  audit-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout without LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pandas openpyxl

      - name: Audit Bogotá residence domain
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.audit_bogota2015_domain \
            --output-dir outputs/bogota_2015_domain_audit \
            2>&1 | tee bogota2015-domain-audit.log

      - name: Upload aggregate domain diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-bogota2015-domain-audit
          path: |
            bogota2015-domain-audit.log
            outputs/bogota_2015_domain_audit/encuestas_schema.csv
            outputs/bogota_2015_domain_audit/candidate_value_counts.csv
            outputs/bogota_2015_domain_audit/domain_weight_summary.csv
            outputs/bogota_2015_domain_audit/weight_candidate_sums.csv
            outputs/bogota_2015_domain_audit/domain_audit_metadata.json
          if-no-files-found: warn
          retention-days: 14
