name: Paper I methodological tests

on:
  push:
    paths:
      - 'scripts/__init__.py'
      - 'scripts/scalar_compressibility.py'
      - 'scripts/reference_distributions.py'
      - 'scripts/support_diagnostics.py'
      - 'scripts/paper1_protocol.py'
      - 'scripts/mobility_function.py'
      - 'scripts/person_day.py'
      - 'scripts/person_universe.py'
      - 'scripts/paper1_adapters.py'
      - 'scripts/survey_bootstrap.py'
      - 'scripts/kitagawa_mobility.py'
      - 'scripts/run_paper1_pilot_stage1.py'
      - 'tests/test_scalar_compressibility.py'
      - 'tests/test_reference_distributions.py'
      - 'tests/test_support_diagnostics.py'
      - 'tests/test_mobility_function.py'
      - 'tests/test_person_day.py'
      - 'tests/test_person_universe.py'
      - 'tests/test_paper1_adapters.py'
      - 'tests/test_survey_bootstrap.py'
      - 'tests/test_kitagawa_mobility.py'
      - '.github/workflows/paper1-methods-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/paper1-methods-tests.yml'

jobs:
  test-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest

      - name: Run Paper I methodological tests
        run: |
          python -m pytest -q \
            --junitxml=paper1-pytest.xml \
            tests/test_scalar_compressibility.py \
            tests/test_reference_distributions.py \
            tests/test_support_diagnostics.py \
            tests/test_mobility_function.py \
            tests/test_person_day.py \
            tests/test_person_universe.py \
            tests/test_paper1_adapters.py \
            tests/test_survey_bootstrap.py \
            tests/test_kitagawa_mobility.py \
            2>&1 | tee paper1-pytest.log

      - name: Smoke-test stage-1 runner imports
        run: |
          python scripts/run_paper1_pilot_stage1.py --help >/dev/null
          python -m scripts.run_paper1_pilot_stage1 --help >/dev/null

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-pytest-diagnostics
          path: |
            paper1-pytest.xml
            paper1-pytest.log
          if-no-files-found: warn
          retention-days: 7
