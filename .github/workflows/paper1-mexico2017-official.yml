name: Paper I — Mexico 2017 official-source QA

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/mexico2017_official_adapter.py'
      - 'scripts/run_mexico_2017_official_stage1.py'
      - 'tests/test_mexico2017_official_adapter.py'
      - '.github/workflows/paper1-mexico2017-official.yml'

jobs:
  mexico2017:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas requests

      - name: Run Mexico/ZMVM direct-source reconstruction
        shell: bash
        run: |
          set -o pipefail
          mkdir -p outputs/mexico_2017_official_stage1
          python -m scripts.run_mexico_2017_official_stage1 \
            --output-dir outputs/mexico_2017_official_stage1 \
            2>&1 | tee mexico2017-official-stage1.log

      - name: Upload aggregate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-mexico2017-official-diagnostics
          path: |
            mexico2017-official-stage1.log
            outputs/mexico_2017_official_stage1/adapter_audit.csv
            outputs/mexico_2017_official_stage1/universe_audit.csv
            outputs/mexico_2017_official_stage1/diary_exclusions.csv
            outputs/mexico_2017_official_stage1/weekday_universe_summary.csv
            outputs/mexico_2017_official_stage1/person_day_qa.csv
            outputs/mexico_2017_official_stage1/support_diagnostics.csv
            outputs/mexico_2017_official_stage1/time_participation_cells.csv
            outputs/mexico_2017_official_stage1/run_metadata.json
          if-no-files-found: warn
          retention-days: 14
