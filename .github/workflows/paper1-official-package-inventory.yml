name: Paper I — inventory official EOD packages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paper1-official-package-inventory.yml'

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install inventory dependencies
        run: python -m pip install requests beautifulsoup4 urllib3

      - name: Download and inventory official packages
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' | tee official-package-inventory.log
          from __future__ import annotations
          from io import BytesIO
          import hashlib
          import re
          import zipfile
          from urllib.parse import urljoin
          import requests
          import urllib3
          from bs4 import BeautifulSoup

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (ENMODO Paper I reproducibility audit)"})

          def decode(raw: bytes) -> str:
              for enc in ("utf-8-sig", "latin-1"):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode("utf-8", errors="replace")

          def dump_member(zf: zipfile.ZipFile, name: str) -> None:
              print(f"--- {name} ---")
              text = decode(zf.read(name))
              print(text[:20000].rstrip())

          mexico_url = "https://www.inegi.org.mx/contenidos/programas/eod/2017/datosabiertos/eod_2017_csv.zip"
          print("===== Mexico EOD 2017 =====")
          r = session.get(mexico_url, timeout=180, allow_redirects=True)
          print(f"URL: {mexico_url}")
          print(f"HTTP: {r.status_code}")
          print(f"FINAL_URL: {r.url}")
          print(f"CONTENT_TYPE: {r.headers.get('content-type')}")
          print(f"BYTES: {len(r.content)}")
          print(f"SHA256: {hashlib.sha256(r.content).hexdigest()}")
          r.raise_for_status()
          zf = zipfile.ZipFile(BytesIO(r.content))
          names = zf.namelist()
          print(f"ZIP_ENTRIES: {len(names)}")
          for member in [
              "tviaje_eod2017/catalogos/p5_3.csv",
              "tviaje_eod2017/catalogos/p5_11a.csv",
              "tviaje_eod2017/catalogos/p5_13.csv",
              "tviaje_eod2017/diccionario_de_datos/diccionario_datos_tviaje.csv",
              "tsdem_eod2017/catalogos/p5_4.csv",
              "tsdem_eod2017/diccionario_de_datos/diccionario_datos_tsdem.csv",
          ]:
              if member in names:
                  dump_member(zf, member)
              else:
                  print(f"MISSING_MEMBER: {member}")

          for member in [
              "tviaje_eod2017/conjunto_de_datos/tviaje.csv",
              "tsdem_eod2017/conjunto_de_datos/tsdem.csv",
          ]:
              raw = zf.read(member)
              rows_approx = raw.count(bytes([10])) - 1
              print(f"ROWS_APPROX {member}: {rows_approx}")

          print("\n===== Bogota EOD 2015 endpoint =====")
          bog_url = "https://simur.gov.co/sites/simur.gov.co/files/2021-06-24/basico/Encuesta_de_Movilidad_2015.zip"
          try:
              br = session.get(bog_url, timeout=120, allow_redirects=True, verify=False)
              print(f"URL: {bog_url}")
              print(f"HTTP: {br.status_code}")
              print(f"FINAL_URL: {br.url}")
              print(f"BYTES: {len(br.content)}")
              print(f"SHA256: {hashlib.sha256(br.content).hexdigest()}")
          except Exception as exc:
              print(f"BOGOTA_ERROR: {type(exc).__name__}: {exc}")

          print("\n===== SECTRA EOD Santiago 2012 discovery =====")
          sectra_url = "https://www.sectra.gob.cl/info-territorial/region-metropolitana-de-santiago/"
          try:
              sr = session.get(sectra_url, timeout=60, allow_redirects=True, verify=False)
              print(f"HTTP: {sr.status_code}")
              print(f"FINAL_URL: {sr.url}")
              print(f"BYTES: {len(sr.content)}")
              soup = BeautifulSoup(sr.text, "html.parser")
              for a in soup.find_all("a"):
                  href = a.get("href")
                  text = " ".join(a.stripped_strings)
                  if not href:
                      continue
                  full = urljoin(sr.url, href)
                  haystack = text + " " + full
                  if re.search(r"2012|base.?de.?datos|descarg|eod|csv|zip|rar|7z|santiago|biblioteca", haystack, re.I):
                      parent = a
                      for _ in range(4):
                          if parent.parent is None:
                              break
                          parent = parent.parent
                      context = " ".join(parent.stripped_strings)
                      print(f"LINK\t{text[:200]}\t{full}")
                      print(f"CONTEXT\t{context[:1500]}")
          except Exception as exc:
              print(f"SECTRA_ERROR: {type(exc).__name__}: {exc}")
          PY

      - name: Upload official package inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper1-official-package-inventory
          path: official-package-inventory.log
          retention-days: 14
